spring:
  application:
    name: bukovina-platform
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/bukovina_platform}
    username: ${DB_USERNAME:bukovina_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

booking:
  public:
    large-group-threshold: ${BOOKING_LARGE_GROUP_THRESHOLD:20}

admin:
  authentication:
    jwt:
      issuer: ${ADMIN_JWT_ISSUER:nisztor-bukovina-platform}
      secret: ${ADMIN_JWT_SECRET:}
      access-token-ttl: ${ADMIN_JWT_ACCESS_TOKEN_TTL:PT30M}
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    login-rate-limit:
      enabled: ${ADMIN_LOGIN_RATE_LIMIT_ENABLED:true}
      capacity: ${ADMIN_LOGIN_RATE_LIMIT_CAPACITY:5}
      refill-period: ${ADMIN_LOGIN_RATE_LIMIT_REFILL_PERIOD:PT1M}
      cache-ttl: ${ADMIN_LOGIN_RATE_LIMIT_CACHE_TTL:PT10M}
      max-entries: ${ADMIN_LOGIN_RATE_LIMIT_MAX_ENTRIES:10000}

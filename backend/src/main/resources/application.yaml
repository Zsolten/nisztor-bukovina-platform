spring:
  application:
    name: bukovina-platform
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:15432/bukovina_platform}
    username: ${DB_USERNAME:bukovina_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

booking:
  public:
    large-group-threshold: ${BOOKING_LARGE_GROUP_THRESHOLD:20}

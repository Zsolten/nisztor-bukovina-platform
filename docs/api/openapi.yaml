openapi: 3.1.0
info:
  title: Nisztor-Bukovina Platform API
  version: 0.1.0
  description: Contract-first REST API for the Nisztor-Bukovina Platform.
servers:
  - url: /api
paths:
  /guesthouses:
    get:
      operationId: listGuesthouses
      summary: List active guesthouses
      description: Returns the two independently managed active guesthouses for FR-GH-001.
      tags: [Guesthouses]
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Active guesthouses in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuesthouseSummary'
        '400':
          description: The requested language is not supported.
  /guesthouses/{slug}:
    get:
      operationId: getGuesthouse
      summary: Get an active guesthouse by slug
      description: Returns one active guesthouse and its gallery for FR-GH-001.
      tags: [Guesthouses]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Guesthouse details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuesthouseDetail'
        '404':
          description: The guesthouse does not exist or is inactive.
        '400':
          description: The slug or requested language is invalid.
components:
  parameters:
    Language:
      name: lang
      in: query
      required: false
      description: Requested content language. Missing translations fall back to Hungarian.
      schema:
        type: string
        enum: [hu, ro, en]
        default: hu
  schemas:
    GuesthouseImage:
      type: object
      required: [path, altText, cover]
      properties:
        path:
          type: string
          example: /images/guesthouses/nisztor/gallery-01.jpg
        altText:
          type: string
        cover:
          type: boolean
    GuesthouseHistory:
      type: object
      required: [title, text]
      properties:
        title:
          type: string
        text:
          type: string
    GuesthouseContact:
      type: object
      required: [type, value, label, preferred]
      properties:
        type:
          type: string
          enum: [PERSON, PHONE, EMAIL]
        value:
          type: string
        label:
          type: string
        preferred:
          type: boolean
    GuesthouseAddress:
      type: object
      required: [formatted, latitude, longitude]
      properties:
        formatted:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    RoomType:
      type: object
      required:
        - id
        - name
        - quantity
        - standardOccupancy
        - roomsWithExtraBed
        - extraBedsPerEligibleRoom
        - features
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
        standardOccupancy:
          type: integer
          minimum: 1
        roomsWithExtraBed:
          type: integer
          minimum: 0
        extraBedsPerEligibleRoom:
          type: integer
          minimum: 0
        features:
          type: array
          items:
            type: string
    Amenity:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [ROOM_COMFORT, FOOD_KITCHEN, OUTDOOR_WELLNESS, PROGRAM_GROUP]
    PriceItem:
      type: object
      required: [id, label, amount, unit]
      properties:
        id:
          type: string
        label:
          type: string
        amount:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [person_night, person, day]
    PricingAdjustment:
      type: object
      required: [id, label, percentage]
      properties:
        id:
          type: string
        label:
          type: string
        percentage:
          type: number
          minimum: 0
          maximum: 100
    GuesthousePricing:
      type: object
      required: [currency, items, surcharges, discounts, paymentNote]
      properties:
        currency:
          type: string
          enum: [RON]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        paymentNote:
          type: string
    GuesthouseSummary:
      type: object
      required: [slug, name, shortDescription, roomCount, coverImage]
      properties:
        slug:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        roomCount:
          type: integer
          minimum: 1
        coverImage:
          $ref: '#/components/schemas/GuesthouseImage'
    GuesthouseDetail:
      allOf:
        - $ref: '#/components/schemas/GuesthouseSummary'
        - type: object
          required:
            - description
            - roomDescription
            - images
            - history
            - contacts
            - address
            - roomTypes
            - amenities
            - pricing
          properties:
            description:
              type: string
            roomDescription:
              type: string
            images:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/GuesthouseImage'
            history:
              $ref: '#/components/schemas/GuesthouseHistory'
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/GuesthouseContact'
            address:
              $ref: '#/components/schemas/GuesthouseAddress'
            roomTypes:
              type: array
              items:
                $ref: '#/components/schemas/RoomType'
            amenities:
              type: array
              items:
                $ref: '#/components/schemas/Amenity'
            pricing:
              $ref: '#/components/schemas/GuesthousePricing'

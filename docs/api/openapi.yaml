openapi: 3.1.0
info:
  title: Nisztor-Bukovina Platform API
  version: 0.1.0
  description: Contract-first REST API for the Nisztor-Bukovina Platform.
servers:
  - url: /api
paths:
  /guesthouses:
    get:
      operationId: listGuesthouses
      summary: List active guesthouses
      description: Returns the two independently managed active guesthouses for FR-GH-001.
      tags: [Guesthouses]
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Active guesthouses in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuesthouseSummary'
        '400':
          description: The requested language is not supported.
  /guesthouses/{slug}:
    get:
      operationId: getGuesthouse
      summary: Get an active guesthouse by slug
      description: Returns one active guesthouse and its gallery for FR-GH-001.
      tags: [Guesthouses]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Guesthouse details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuesthouseDetail'
        '404':
          description: The guesthouse does not exist or is inactive.
        '400':
          description: The slug or requested language is invalid.
  /booking-quotes:
    post:
      operationId: createBookingQuote
      summary: Validate and calculate a public booking quote
      description: Does not persist a booking and does not check date-based availability.
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingQuoteRequest'
      responses:
        '200':
          description: Authoritative current quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingQuote'
        '400':
          $ref: '#/components/responses/BookingValidationError'
  /booking-requests:
    post:
      operationId: createBookingRequest
      summary: Submit a public booking request
      description: Revalidates and recalculates the quote before atomically persisting a request in RECEIVED state.
      tags: [Bookings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for safe retry of one logical submission.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking request received; this is not a confirmed reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRequestCreated'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '409':
          description: The accepted quote changed or the idempotency key was reused for different input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
components:
  responses:
    BookingValidationError:
      description: One or more request fields or cross-field booking rules are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingError'
  parameters:
    Language:
      name: lang
      in: query
      required: false
      description: Requested content language. Missing translations fall back to Hungarian.
      schema:
        type: string
        enum: [hu, ro, en]
        default: hu
  schemas:
    GuesthouseImage:
      type: object
      required: [path, altText, cover]
      properties:
        path:
          type: string
          example: /images/guesthouses/nisztor/gallery-01.jpg
        altText:
          type: string
        cover:
          type: boolean
    GuesthouseHistory:
      type: object
      required: [title, text]
      properties:
        title:
          type: string
        text:
          type: string
    GuesthouseContact:
      type: object
      required: [type, value, label, preferred]
      properties:
        type:
          type: string
          enum: [PERSON, PHONE, EMAIL]
        value:
          type: string
        label:
          type: string
        preferred:
          type: boolean
    GuesthouseAddress:
      type: object
      required: [formatted, latitude, longitude]
      properties:
        formatted:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    RoomType:
      type: object
      required:
        - id
        - name
        - quantity
        - standardOccupancy
        - roomsWithExtraBed
        - extraBedsPerEligibleRoom
        - features
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
        standardOccupancy:
          type: integer
          minimum: 1
        roomsWithExtraBed:
          type: integer
          minimum: 0
        extraBedsPerEligibleRoom:
          type: integer
          minimum: 0
        features:
          type: array
          items:
            type: string
    Amenity:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [ROOM_COMFORT, FOOD_KITCHEN, OUTDOOR_WELLNESS, PROGRAM_GROUP]
    PriceItem:
      type: object
      required: [id, label, amount, unit]
      properties:
        id:
          type: string
        label:
          type: string
        amount:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [person_night, person, day]
    PricingAdjustment:
      type: object
      required: [id, label, percentage]
      properties:
        id:
          type: string
        label:
          type: string
        percentage:
          type: number
          minimum: 0
          maximum: 100
    GuesthousePricing:
      type: object
      required: [currency, items, taxes, surcharges, discounts, paymentNote]
      properties:
        currency:
          type: string
          enum: [RON]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        taxes:
          type: array
          description: Informational taxes displayed separately and excluded from booking totals.
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        paymentNote:
          type: string
    GuesthouseSummary:
      type: object
      required: [id, slug, name, shortDescription, roomCount, coverImage]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        roomCount:
          type: integer
          minimum: 1
        coverImage:
          $ref: '#/components/schemas/GuesthouseImage'
    GuesthouseDetail:
      allOf:
        - $ref: '#/components/schemas/GuesthouseSummary'
        - type: object
          required:
            - description
            - roomDescription
            - images
            - history
            - contacts
            - address
            - roomTypes
            - amenities
            - pricing
          properties:
            description:
              type: string
            roomDescription:
              type: string
            images:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/GuesthouseImage'
            history:
              $ref: '#/components/schemas/GuesthouseHistory'
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/GuesthouseContact'
            address:
              $ref: '#/components/schemas/GuesthouseAddress'
            roomTypes:
              type: array
              items:
                $ref: '#/components/schemas/RoomType'
            amenities:
              type: array
              items:
                $ref: '#/components/schemas/Amenity'
            pricing:
              $ref: '#/components/schemas/GuesthousePricing'
    BookingRoomSelection:
      type: object
      additionalProperties: false
      required: [roomTypeId, quantity]
      properties:
        roomTypeId:
          type: string
          format: uuid
        quantity:
          type: integer
    BookingServices:
      type: object
      additionalProperties: false
      properties:
        breakfastParticipants:
          type: integer
          minimum: 0
          default: 0
        dinnerParticipants:
          type: integer
          minimum: 0
          default: 0
    BookingQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - guesthouseId
        - checkInDate
        - checkOutDate
        - adults
        - childrenAge3to10
        - childrenAge0to3
        - roomSelections
      properties:
        guesthouseId:
          type: string
          format: uuid
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        adults:
          type: integer
          minimum: 0
        childrenAge3to10:
          type: integer
          minimum: 0
        childrenAge0to3:
          type: integer
          minimum: 0
        roomSelections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingRoomSelection'
        services:
          $ref: '#/components/schemas/BookingServices'
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required:
        - guesthouseId
        - checkInDate
        - checkOutDate
        - adults
        - childrenAge3to10
        - childrenAge0to3
        - roomSelections
        - contactName
        - contactEmail
        - contactPhone
        - preferredLanguage
        - acceptedTotal
      properties:
        guesthouseId:
          type: string
          format: uuid
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        adults:
          type: integer
          minimum: 0
        childrenAge3to10:
          type: integer
          minimum: 0
        childrenAge0to3:
          type: integer
          minimum: 0
        roomSelections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingRoomSelection'
        services:
          $ref: '#/components/schemas/BookingServices'
        contactName:
          type: string
          minLength: 1
          maxLength: 160
        contactEmail:
          type: string
          format: email
          maxLength: 320
        contactPhone:
          type: string
          pattern: '^\+?[0-9][0-9 ()-]{6,38}$'
          maxLength: 40
        preferredLanguage:
          type: string
          enum: [hu, ro, en]
        note:
          type: string
          maxLength: 2000
        acceptedTotal:
          type: number
          minimum: 0
    BookingPriceLine:
      type: object
      required: [code, quantity, unitAmount, lineTotal]
      properties:
        code:
          type: string
        quantity:
          type: integer
          format: int64
          minimum: 0
        unitAmount:
          type: number
          minimum: 0
        lineTotal:
          type: number
          minimum: 0
    BookingPriceBreakdown:
      type: object
      description: Stored booking price snapshot without VAT or city tax calculation.
      required:
        - accommodationTotal
        - singleRoomSurcharge
        - breakfastTotal
        - dinnerTotal
        - totalPayable
      properties:
        accommodationTotal: { type: number, minimum: 0 }
        singleRoomSurcharge: { type: number, minimum: 0 }
        breakfastTotal: { type: number, minimum: 0 }
        dinnerTotal: { type: number, minimum: 0 }
        totalPayable: { type: number, minimum: 0 }
    BookingQuote:
      type: object
      required:
        - currency
        - nights
        - totalGuests
        - selectedRoomCount
        - selectedCapacity
        - lines
        - priceBreakdown
        - requestOnly
      properties:
        currency:
          type: string
          enum: [RON]
        nights:
          type: integer
          format: int64
          minimum: 1
        totalGuests:
          type: integer
          minimum: 1
        selectedRoomCount:
          type: integer
          minimum: 1
        selectedCapacity:
          type: integer
          minimum: 1
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BookingPriceLine'
        priceBreakdown:
          $ref: '#/components/schemas/BookingPriceBreakdown'
        requestOnly:
          type: boolean
          const: true
    BookingRequestCreated:
      type: object
      required: [reference, status, currency, nights, totalGuests, totalPayable, requestOnly]
      properties:
        reference:
          type: string
          pattern: '^NB-[A-F0-9]{16}$'
        status:
          type: string
          enum: [RECEIVED]
        currency:
          type: string
          enum: [RON]
        nights:
          type: integer
          format: int64
          minimum: 1
        totalGuests:
          type: integer
          minimum: 1
        totalPayable:
          type: number
          minimum: 0
        requestOnly:
          type: boolean
          const: true
    BookingFieldError:
      type: object
      required: [code, field, rule]
      properties:
        code:
          type: string
        field:
          type: string
        rule:
          type: string
    BookingError:
      type: object
      required: [code, errors]
      properties:
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BookingFieldError'
        currentQuote:
          $ref: '#/components/schemas/BookingQuote'

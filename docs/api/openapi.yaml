openapi: 3.1.0
info:
  title: Nisztor-Bukovina Platform API
  version: 0.1.0
  description: Contract-first REST API for the Nisztor-Bukovina Platform.
servers:
  - url: /api
paths:
  /guesthouses:
    get:
      operationId: listGuesthouses
      summary: List active guesthouses
      description: Returns the two independently managed active guesthouses for FR-GH-001.
      tags: [Guesthouses]
      parameters:
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Active guesthouses in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuesthouseSummary'
        '400':
          description: The requested language is not supported.
  /guesthouses/{slug}:
    get:
      operationId: getGuesthouse
      summary: Get an active guesthouse by slug
      description: Returns one active guesthouse and its gallery for FR-GH-001.
      tags: [Guesthouses]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Guesthouse details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuesthouseDetail'
        '404':
          description: The guesthouse does not exist or is inactive.
        '400':
          description: The slug or requested language is invalid.
  /booking-quotes:
    post:
      operationId: createBookingQuote
      summary: Validate and calculate a public booking quote
      description: Does not persist a booking and does not check date-based availability.
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingQuoteRequest'
      responses:
        '200':
          description: Authoritative current quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingQuote'
        '400':
          $ref: '#/components/responses/BookingValidationError'
  /booking-requests:
    post:
      operationId: createBookingRequest
      summary: Submit a public booking request
      description: Revalidates and recalculates the quote before atomically persisting a request in RECEIVED state.
      tags: [Bookings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for safe retry of one logical submission.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking request received; this is not a confirmed reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRequestCreated'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '409':
          description: The accepted quote changed or the idempotency key was reused for different input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingError'
  /booking-management/{token}:
    get:
      operationId: getBookingManagementSummary
      summary: Get a booking-request summary through its management token
      tags: [Bookings]
      parameters:
        - $ref: '#/components/parameters/BookingManagementToken'
        - $ref: '#/components/parameters/Language'
      responses:
        '200':
          description: Token-scoped, non-editable booking-request summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingManagementSummary'
        '404':
          $ref: '#/components/responses/BookingManagementLinkInvalid'
  /booking-management/{token}/cancellation:
    post:
      operationId: cancelBookingThroughManagementLink
      summary: Cancel a cancellable booking request through its management token
      tags: [Bookings]
      parameters:
        - $ref: '#/components/parameters/BookingManagementToken'
      responses:
        '204':
          description: The booking request was cancelled and the token was revoked.
        '404':
          $ref: '#/components/responses/BookingManagementLinkInvalid'
        '409':
          description: The valid token belongs to a booking that cannot be self-service cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingManagementError'
  /admin/auth/login:
    post:
      operationId: loginAdministrator
      summary: Authenticate an administrator
      tags: [Administration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Short-lived administrator access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Invalid, inactive, or missing administrator credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthenticationError'
        '429':
          description: Too many login attempts from the same IP address for the same email address.
          headers:
            Retry-After:
              description: Seconds until another login attempt can be made.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthenticationError'
  /admin/auth/logout:
    post:
      operationId: logoutAdministrator
      summary: Revoke the current administrator access token
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      responses:
        '204':
          description: The current token was revoked.
        '401':
          description: The access token is missing, invalid, expired, or revoked.
  /admin/bookings:
    get:
      operationId: listAdminBookings
      summary: List booking requests for the administrator work queue
      description: Returns booking requests ordered by check-in date ascending by default. Creation dates are interpreted as inclusive UTC calendar dates.
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - name: guesthouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: search
          in: query
          required: false
          description: Case-insensitive partial match on booking reference or contact name.
          schema:
            type: string
        - name: createdFrom
          in: query
          required: false
          description: Inclusive lower creation-date bound in UTC.
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          required: false
          description: Inclusive upper creation-date bound in UTC.
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [checkInDate, totalPayable, createdAt]
            default: checkInDate
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: One page of booking requests in the requested order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingPage'
        '400':
          description: A filter or pagination parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingError'
        '401':
          description: Administrator authentication is missing or invalid.
        '403':
          description: The authenticated account is not an administrator.
  /admin/bookings/{bookingId}:
    get:
      operationId: getAdminBooking
      summary: Load a booking request by its internal administrator identifier
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete administrator booking detail without secret tokens or hashes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingDetail'
        '401':
          description: Administrator authentication is missing or invalid.
        '403':
          description: The authenticated account is not an administrator.
        '404':
          description: No booking request exists with the supplied internal identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingError'
  /admin/bookings/{bookingId}/status:
    patch:
      operationId: changeAdminBookingStatus
      summary: Move a booking request through the administrator review workflow
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingStatusUpdateRequest'
      responses:
        '204':
          description: Status changed and one administrator history entry was recorded. A confirmed or rejected decision also queues a localized guest notification.
        '400':
          description: The request is malformed or the requested status transition is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingWorkflowError'
        '401':
          description: Administrator authentication is missing or invalid.
        '403':
          description: The authenticated account is not an administrator.
        '404':
          description: No booking request exists with the supplied internal identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingError'
  /admin/bookings/{bookingId}/internal-note:
    patch:
      operationId: updateAdminBookingInternalNote
      summary: Replace or clear the administrator-only internal note
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingInternalNoteUpdateRequest'
      responses:
        '204':
          description: Internal note replaced or cleared. Blank text is stored as no note.
        '400':
          description: The request is malformed or the note exceeds the maximum length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingWorkflowError'
        '401':
          description: Administrator authentication is missing or invalid.
        '403':
          description: The authenticated account is not an administrator.
        '404':
          description: No booking request exists with the supplied internal identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingError'
  /admin/guesthouses/content:
    get:
      operationId: listAdminGuesthouseContent
      summary: List editable content for every guesthouse
      description: Returns active and inactive guesthouses with raw HU, RO, and EN translations. Missing translations are returned as empty editable records without applying public fallback.
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Guesthouses in display order with all editable translations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminGuesthouseContent'
        '401':
          description: Administrator authentication is missing or invalid.
        '403':
          description: The authenticated account is not an administrator.
  /admin/guesthouses/{guesthouseId}/translations/{language}:
    put:
      operationId: updateAdminGuesthouseTranslation
      summary: Create or replace one guesthouse translation
      description: Uses a per-translation version for optimistic concurrency. A missing translation is created when version is null.
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - name: guesthouseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: language
          in: path
          required: true
          schema:
            type: string
            enum: [hu, ro, en]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGuesthouseTranslationUpdate'
      responses:
        '200':
          description: Saved translation with its current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGuesthouseTranslation'
        '400':
          description: Unsupported language, malformed input, or field validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGuesthouseContentError'
        '401':
          description: Administrator authentication is missing or invalid.
        '403':
          description: The authenticated account is not an administrator.
        '404':
          description: No guesthouse exists with the supplied identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGuesthouseContentError'
        '409':
          description: The translation was changed after the administrator loaded it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGuesthouseContentError'
  /admin/guesthouses/{guesthouseId}/pricing:
    get:
      operationId: getAdminGuesthousePricing
      summary: Get the current editable prices of one guesthouse
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuesthouseId'
      responses:
        '200':
          description: Current guesthouse prices, surcharges, and discounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGuesthousePricing' }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404':
          description: No guesthouse or active price configuration exists with the supplied identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGuesthousePricingError' }
    put:
      operationId: updateAdminGuesthousePricing
      summary: Replace the current numeric prices of one guesthouse
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GuesthouseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminGuesthousePricingUpdate' }
      responses:
        '200':
          description: Updated current guesthouse prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGuesthousePricing' }
        '400':
          description: Invalid, missing, duplicate, negative, or unknown price values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGuesthousePricingError' }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404':
          description: No guesthouse or active price configuration exists with the supplied identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminGuesthousePricingError' }
  /admin/guesthouses/{guesthouseId}/room-types:
    get:
      operationId: listAdminRoomTypes
      summary: List editable room types of one guesthouse
      tags: [Administration]
      security: [{ AdminBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/GuesthouseId' }]
      responses:
        '200':
          description: Room types in public display order.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminRoomType' } } } }
        '400': { description: Invalid request. }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404': { description: Guesthouse not found. }
    post:
      operationId: createAdminRoomType
      summary: Create a guesthouse-specific room type
      tags: [Administration]
      security: [{ AdminBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/GuesthouseId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoomTypeUpdate' } } }
      responses:
        '201':
          description: Created room type.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoomType' } } }
        '400': { description: Invalid room type data. }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404': { description: Guesthouse not found. }
  /admin/guesthouses/{guesthouseId}/room-types/{roomTypeId}:
    put:
      operationId: updateAdminRoomType
      summary: Update a room type, including its selectable quantity
      tags: [Administration]
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GuesthouseId'
        - name: roomTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoomTypeUpdate' } } }
      responses:
        '200':
          description: Updated room type.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoomType' } } }
        '400': { description: Invalid room type data. }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404': { description: Guesthouse or room type not found. }
  /admin/guesthouses/{guesthouseId}/room-types/order:
    put:
      operationId: reorderAdminRoomTypes
      summary: Replace the room-type display order of one guesthouse
      tags: [Administration]
      security: [{ AdminBearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/GuesthouseId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoomTypeOrderUpdate' } } }
      responses:
        '204': { description: Room types reordered. }
        '400': { description: Invalid room type order. }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404': { description: Guesthouse not found. }
  /admin/amenities:
    get:
      operationId: listAdminAmenities
      summary: List the editable guesthouse service catalogue
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      responses:
        '200':
          description: Every service definition with its translations and guesthouse assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAmenity'
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
    post:
      operationId: createAdminAmenity
      summary: Create a service definition and optionally assign it to guesthouses
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAmenityUpdate'
      responses:
        '201':
          description: Created service definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAmenity'
        '400':
          description: Invalid category, classification, translation, assignment, or request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '409':
          description: A service already uses the supplied stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
  /admin/amenities/{amenityId}:
    put:
      operationId: updateAdminAmenity
      summary: Replace a service definition and its guesthouse assignments
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AmenityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAmenityUpdate' }
      responses:
        '200':
          description: Saved service definition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenity' }
        '400':
          description: Invalid category, classification, translation, assignment, or request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404':
          description: The service or an assigned guesthouse does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
        '409':
          description: A different service already uses the supplied stable code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
  /admin/guesthouses/{guesthouseId}/amenities/order:
    put:
      operationId: reorderAdminGuesthouseAmenities
      summary: Replace the display order of one guesthouse's assigned services
      tags: [Administration]
      security:
        - AdminBearerAuth: []
      parameters:
        - name: guesthouseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAmenityOrderUpdate' }
      responses:
        '204': { description: The service order was updated. }
        '400':
          description: The ordered identifiers do not exactly match the guesthouse assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
        '401': { description: Administrator authentication is missing or invalid. }
        '403': { description: The authenticated account is not an administrator. }
        '404':
          description: The guesthouse does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAmenityError' }
  /tourism/attractions:
    get:
      operationId: listPublicAttractions
      summary: List active attractions that have the requested translation
      tags: [Tourism]
      parameters:
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Language' } }
      responses:
        '200':
          description: Active attractions.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AttractionPublic' } }
  /tourism/collections:
    get:
      operationId: listPublicTourismCollections
      summary: List active editorial tourism collections that have the requested translation
      tags: [Tourism]
      parameters:
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Language' } }
      responses:
        '200':
          description: Active tourism collections.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TourismCollection' } }
  /tourism/attractions/{slug}:
    get:
      operationId: getPublicAttraction
      summary: Get one active attraction
      tags: [Tourism]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Language' } }
      responses:
        '200':
          description: Attraction detail.
          content: { application/json: { schema: { $ref: '#/components/schemas/AttractionPublic' } } }
        '404': { description: Attraction not found or inactive. }
  /tourism/star-tours:
    get:
      operationId: listPublicStarTours
      summary: List published and active star tours that have the requested translation
      tags: [Tourism]
      parameters:
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Language' } }
      responses:
        '200':
          description: Public star tours.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StarTourPublic' } }
  /tourism/star-tours/{slug}:
    get:
      operationId: getPublicStarTour
      summary: Get one published and active star tour
      tags: [Tourism]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { $ref: '#/components/schemas/Language' } }
      responses:
        '200':
          description: Star tour detail.
          content: { application/json: { schema: { $ref: '#/components/schemas/StarTourPublic' } } }
        '404': { description: Star tour not found, unpublished, or inactive. }
  /admin/tourism/attractions:
    get:
      operationId: listAdminAttractions
      tags: [Administration, Tourism]
      security: [{ AdminBearerAuth: [] }]
      responses:
        '200':
          description: All attractions including inactive records.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminAttraction' } }
        '401': { description: Administrator authentication is missing or invalid. }
    post:
      operationId: createAdminAttraction
      tags: [Administration, Tourism]
      security: [{ AdminBearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttractionUpdate' } } }
      responses:
        '201':
          description: Attraction created.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAttraction' } } }
        '400': { description: Attraction validation failed. }
        '401': { description: Administrator authentication is missing or invalid. }
        '409': { description: Slug already exists. }
  /admin/tourism/attractions/{id}:
    put:
      operationId: updateAdminAttraction
      tags: [Administration, Tourism]
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttractionUpdate' } } }
      responses:
        '200':
          description: Attraction updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAttraction' } } }
        '400': { description: Attraction validation failed. }
        '401': { description: Administrator authentication is missing or invalid. }
        '404': { description: Attraction not found. }
        '409': { description: Slug already exists. }
  /admin/tourism/star-tours:
    get:
      operationId: listAdminStarTours
      tags: [Administration, Tourism]
      security: [{ AdminBearerAuth: [] }]
      responses:
        '200':
          description: All star tours including drafts and inactive records.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminStarTour' } }
        '401': { description: Administrator authentication is missing or invalid. }
    post:
      operationId: createAdminStarTour
      tags: [Administration, Tourism]
      security: [{ AdminBearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StarTourUpdate' } } }
      responses:
        '201':
          description: Star tour created.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStarTour' } } }
        '400': { description: Star tour validation failed. }
        '401': { description: Administrator authentication is missing or invalid. }
        '409': { description: Slug already exists. }
  /admin/tourism/star-tours/{id}:
    put:
      operationId: updateAdminStarTour
      tags: [Administration, Tourism]
      security: [{ AdminBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StarTourUpdate' } } }
      responses:
        '200':
          description: Star tour updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminStarTour' } } }
        '400': { description: Star tour validation failed. }
        '401': { description: Administrator authentication is missing or invalid. }
        '404': { description: Star tour not found. }
        '409': { description: Slug already exists. }
components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BookingValidationError:
      description: One or more request fields or cross-field booking rules are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingError'
    BookingManagementLinkInvalid:
      description: The management link is invalid, expired, revoked, or already used.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BookingManagementError'
  parameters:
    GuesthouseId:
      name: guesthouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AmenityId:
      name: amenityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingManagementToken:
      name: token
      in: path
      required: true
      description: Random URL-safe management token. Its raw value is never persisted.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    Language:
      name: lang
      in: query
      required: false
      description: Requested content language. Missing translations fall back to Hungarian.
      schema:
        type: string
        enum: [hu, ro, en]
        default: hu
  schemas:
    GuesthouseImage:
      type: object
      required: [path, altText, cover]
      properties:
        path:
          type: string
          example: /images/guesthouses/nisztor/gallery-01.jpg
        altText:
          type: string
        cover:
          type: boolean
    GuesthouseHistory:
      type: object
      required: [title, text]
      properties:
        title:
          type: string
        text:
          type: string
    GuesthouseContact:
      type: object
      required: [type, value, label, preferred]
      properties:
        type:
          type: string
          enum: [PERSON, PHONE, EMAIL]
        value:
          type: string
        label:
          type: string
        preferred:
          type: boolean
    GuesthouseAddress:
      type: object
      required: [formatted, latitude, longitude]
      properties:
        formatted:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    RoomType:
      type: object
      required:
        - id
        - name
        - shortDescription
        - quantity
        - standardOccupancy
        - features
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortDescription:
          type: string
        quantity:
          type: integer
          minimum: 0
        standardOccupancy:
          type: integer
          minimum: 1
        features:
          type: array
          items:
            type: string
    Amenity:
      type: object
      required: [id, name, category, pricingType, displayOrder]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [ROOM_COMFORT, FOOD_KITCHEN, OUTDOOR_WELLNESS, PROGRAM_GROUP]
        pricingType:
          type: string
          enum: [FREE, PAID]
        detailedDescription:
          type: string
        displayOrder:
          type: integer
          minimum: 0
    PriceItem:
      type: object
      required: [id, label, amount, unit]
      properties:
        id:
          type: string
        label:
          type: string
        amount:
          type: number
          minimum: 0
        unit:
          type: string
          enum: [person_night, room_night, person, day]
    PricingAdjustment:
      type: object
      required: [id, label, percentage]
      properties:
        id:
          type: string
        label:
          type: string
        percentage:
          type: number
          minimum: 0
          maximum: 100
    GuesthousePricing:
      type: object
      required: [currency, items, taxes, surcharges, discounts, paymentNote]
      properties:
        currency:
          type: string
          enum: [RON]
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceItem'
        taxes:
          type: array
          description: Informational taxes displayed separately and excluded from booking totals.
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/PricingAdjustment'
        paymentNote:
          type: string
    GuesthouseSummary:
      type: object
      required: [id, slug, name, shortDescription, roomCount, coverImage]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        shortDescription:
          type: string
        roomCount:
          type: integer
          minimum: 1
        coverImage:
          $ref: '#/components/schemas/GuesthouseImage'
    GuesthouseDetail:
      allOf:
        - $ref: '#/components/schemas/GuesthouseSummary'
        - type: object
          required:
            - description
            - roomDescription
            - pageText
            - images
            - history
            - contacts
            - address
            - roomTypes
            - amenities
            - pricing
          properties:
            description:
              type: string
            roomDescription:
              type: string
            pageText:
              $ref: '#/components/schemas/GuesthousePageText'
            images:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/GuesthouseImage'
            history:
              $ref: '#/components/schemas/GuesthouseHistory'
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/GuesthouseContact'
            address:
              $ref: '#/components/schemas/GuesthouseAddress'
            roomTypes:
              type: array
              items:
                $ref: '#/components/schemas/RoomType'
            amenities:
              type: array
              items:
                $ref: '#/components/schemas/Amenity'
            pricing:
              $ref: '#/components/schemas/GuesthousePricing'
    BookingRoomSelection:
      type: object
      additionalProperties: false
      required: [roomTypeId, quantity]
      properties:
        roomTypeId:
          type: string
          format: uuid
        quantity:
          type: integer
    BookingServices:
      type: object
      additionalProperties: false
      properties:
        breakfastParticipants:
          type: integer
          minimum: 0
          default: 0
        dinnerParticipants:
          type: integer
          minimum: 0
          default: 0
    BookingQuoteRequest:
      type: object
      additionalProperties: false
      required:
        - guesthouseId
        - checkInDate
        - checkOutDate
        - adults
        - childrenAge3to10
        - childrenAge0to3
        - roomSelections
      properties:
        guesthouseId:
          type: string
          format: uuid
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        adults:
          type: integer
          minimum: 0
        childrenAge3to10:
          type: integer
          minimum: 0
        childrenAge0to3:
          type: integer
          minimum: 0
        roomSelections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingRoomSelection'
        services:
          $ref: '#/components/schemas/BookingServices'
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required:
        - guesthouseId
        - checkInDate
        - checkOutDate
        - adults
        - childrenAge3to10
        - childrenAge0to3
        - roomSelections
        - contactName
        - contactEmail
        - contactPhone
        - preferredLanguage
        - acceptedTotal
      properties:
        guesthouseId:
          type: string
          format: uuid
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        adults:
          type: integer
          minimum: 0
        childrenAge3to10:
          type: integer
          minimum: 0
        childrenAge0to3:
          type: integer
          minimum: 0
        roomSelections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingRoomSelection'
        services:
          $ref: '#/components/schemas/BookingServices'
        contactName:
          type: string
          minLength: 1
          maxLength: 160
        contactEmail:
          type: string
          format: email
          maxLength: 320
        contactPhone:
          type: string
          pattern: '^\+?[0-9][0-9 ()-]{6,38}$'
          maxLength: 40
        preferredLanguage:
          type: string
          enum: [hu, ro, en]
        note:
          type: string
          maxLength: 2000
        acceptedTotal:
          type: number
          minimum: 0
    BookingPriceLine:
      type: object
      required: [code, quantity, unitAmount, lineTotal]
      properties:
        code:
          type: string
        quantity:
          type: integer
          format: int64
          minimum: 0
        unitAmount:
          type: number
          minimum: 0
        lineTotal:
          type: number
          minimum: 0
    BookingPriceBreakdown:
      type: object
      description: Stored booking price snapshot without VAT or city tax calculation.
      required:
        - accommodationTotal
        - adultAccommodationTotal
        - childAccommodationTotal
        - singleRoomSurcharge
        - breakfastTotal
        - dinnerTotal
        - totalPayable
      properties:
        accommodationTotal: { type: number, minimum: 0 }
        adultAccommodationTotal: { type: number, minimum: 0 }
        childAccommodationTotal: { type: number, minimum: 0 }
        singleRoomSurcharge: { type: number, minimum: 0 }
        breakfastTotal: { type: number, minimum: 0 }
        dinnerTotal: { type: number, minimum: 0 }
        totalPayable: { type: number, minimum: 0 }
    BookingQuote:
      type: object
      required:
        - currency
        - nights
        - totalGuests
        - selectedRoomCount
        - selectedCapacity
        - lines
        - priceBreakdown
        - requestOnly
      properties:
        currency:
          type: string
          enum: [RON]
        nights:
          type: integer
          format: int64
          minimum: 1
        totalGuests:
          type: integer
          minimum: 1
        selectedRoomCount:
          type: integer
          minimum: 1
        selectedCapacity:
          type: integer
          minimum: 1
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BookingPriceLine'
        priceBreakdown:
          $ref: '#/components/schemas/BookingPriceBreakdown'
        requestOnly:
          type: boolean
          const: true
    BookingRequestCreated:
      type: object
      required: [reference, status, currency, nights, totalGuests, totalPayable, requestOnly]
      properties:
        reference:
          type: string
          pattern: '^NB-[A-F0-9]{16}$'
        status:
          type: string
          enum: [RECEIVED]
        currency:
          type: string
          enum: [RON]
        nights:
          type: integer
          format: int64
          minimum: 1
        totalGuests:
          type: integer
          minimum: 1
        totalPayable:
          type: number
          minimum: 0
        requestOnly:
          type: boolean
          const: true
    BookingManagementSummary:
      type: object
      required: [reference, status, guesthouse, stay, guests, services, rooms, price, cancellationAllowed]
      properties:
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        guesthouse:
          type: object
          required: [name, contacts]
          properties:
            name: { type: string }
            contacts:
              type: array
              items:
                type: object
                required: [type, value, preferred]
                properties:
                  type: { type: string, enum: [PHONE, EMAIL] }
                  value: { type: string }
                  label: { type: [string, 'null'] }
                  preferred: { type: boolean }
        stay:
          type: object
          required: [checkInDate, checkOutDate, nights]
          properties:
            checkInDate: { type: string, format: date }
            checkOutDate: { type: string, format: date }
            nights: { type: integer, format: int64, minimum: 1 }
        guests:
          type: object
          required: [adults, childrenAge3to10, childrenAge0to3]
          properties:
            adults: { type: integer, minimum: 0 }
            childrenAge3to10: { type: integer, minimum: 0 }
            childrenAge0to3: { type: integer, minimum: 0 }
        services:
          type: object
          required: [breakfastParticipants, dinnerParticipants]
          properties:
            breakfastParticipants: { type: integer, minimum: 0 }
            dinnerParticipants: { type: integer, minimum: 0 }
        rooms:
          type: array
          items:
            type: object
            required: [name, quantity]
            properties:
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
        price:
          type: object
          required: [accommodationTotal, breakfastTotal, dinnerTotal, totalPayable, currency]
          properties:
            accommodationTotal: { type: number, minimum: 0 }
            breakfastTotal: { type: number, minimum: 0 }
            dinnerTotal: { type: number, minimum: 0 }
            totalPayable: { type: number, minimum: 0 }
            currency: { type: string, enum: [RON] }
        cancellationAllowed: { type: boolean }
    BookingManagementError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [BOOKING_MANAGEMENT_LINK_INVALID, BOOKING_CANCELLATION_NOT_ALLOWED]
    BookingFieldError:
      type: object
      required: [code, field, rule]
      properties:
        code:
          type: string
        field:
          type: string
        rule:
          type: string
    BookingError:
      type: object
      required: [code, errors]
      properties:
        code:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BookingFieldError'
        currentQuote:
          $ref: '#/components/schemas/BookingQuote'
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 256
    AdminLoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
    AdminAuthenticationError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [INVALID_ADMIN_CREDENTIALS, ADMIN_LOGIN_RATE_LIMITED]
    BookingStatus:
      type: string
      enum: [RECEIVED, UNDER_REVIEW, CONFIRMED, REJECTED, CANCELLED]
    AdminBookingSummary:
      type: object
      required:
        - id
        - publicReference
        - guesthouseId
        - guesthouseName
        - status
        - checkInDate
        - checkOutDate
        - nights
        - totalGuests
        - contactName
        - totalPayable
        - currency
        - createdAt
      properties:
        id: { type: string, format: uuid }
        publicReference: { type: string }
        guesthouseId: { type: string, format: uuid }
        guesthouseName: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        nights: { type: integer, format: int64, minimum: 1 }
        totalGuests: { type: integer, minimum: 1 }
        contactName: { type: string }
        totalPayable: { type: number, minimum: 0 }
        currency: { type: string, enum: [RON] }
        createdAt: { type: string, format: date-time }
    AdminBookingPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AdminBookingSummary'
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AdminBookingDetail:
      type: object
      description: Administrator view intentionally excluding management tokens, hashes, idempotency data, and request fingerprints.
      required:
        - id
        - publicReference
        - guesthouse
        - stay
        - contact
        - services
        - rooms
        - priceSnapshot
        - status
        - statusHistory
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        publicReference: { type: string }
        guesthouse:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        stay:
          type: object
          required: [checkInDate, checkOutDate, nights, adults, childrenAge3to10, childrenAge0to3]
          properties:
            checkInDate: { type: string, format: date }
            checkOutDate: { type: string, format: date }
            nights: { type: integer, format: int64, minimum: 1 }
            adults: { type: integer, minimum: 1 }
            childrenAge3to10: { type: integer, minimum: 0 }
            childrenAge0to3: { type: integer, minimum: 0 }
        contact:
          type: object
          required: [name, email, phone, preferredLanguage]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            preferredLanguage: { type: string, enum: [hu, ro, en] }
        services:
          type: object
          required: [breakfastParticipants, dinnerParticipants]
          properties:
            breakfastParticipants: { type: integer, minimum: 0 }
            dinnerParticipants: { type: integer, minimum: 0 }
        rooms:
          type: array
          items:
            type: object
            required: [roomTypeId, roomTypeName, quantity]
            properties:
              roomTypeId: { type: string, format: uuid }
              roomTypeName: { type: string }
              quantity: { type: integer, minimum: 1 }
        priceSnapshot:
          allOf:
            - $ref: '#/components/schemas/BookingPriceBreakdown'
            - type: object
              required: [currency]
              properties:
                currency: { type: string, enum: [RON] }
        status: { $ref: '#/components/schemas/BookingStatus' }
        statusHistory:
          type: array
          items:
            type: object
            required: [status, changedAt, changedBy]
            properties:
              status: { $ref: '#/components/schemas/BookingStatus' }
              changedAt: { type: string, format: date-time }
              changedBy: { type: string }
        guestNote: { type: [string, 'null'] }
        internalNote: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminBookingError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [ADMIN_BOOKING_NOT_FOUND, INVALID_ADMIN_BOOKING_QUERY]
    AdminGuesthouseContent:
      type: object
      additionalProperties: false
      required: [id, slug, active, translations]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        active: { type: boolean }
        translations:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AdminGuesthouseTranslation'
    GuesthousePageText:
      type: object
      additionalProperties: false
      required: [storyEyebrow, storyTitle, diningEyebrow, diningTitle, diningDescription, amenitiesTitle, roomTypesTitle, pricingTitle, historyEyebrow, galleryTitle, galleryHint]
      properties:
        storyEyebrow: { type: string }
        storyTitle: { type: string }
        diningEyebrow: { type: string }
        diningTitle: { type: string }
        diningDescription: { type: string }
        amenitiesTitle: { type: string }
        roomTypesTitle: { type: string }
        pricingTitle: { type: string }
        historyEyebrow: { type: string }
        galleryTitle: { type: string }
        galleryHint: { type: string }
    AdminGuesthouseTranslation:
      type: object
      additionalProperties: false
      required:
        - language
        - version
        - name
        - shortDescription
        - description
        - roomDescription
        - storyEyebrow
        - storyTitle
        - diningEyebrow
        - diningTitle
        - diningDescription
        - amenitiesTitle
        - roomTypesTitle
        - pricingTitle
        - historyEyebrow
        - historyTitle
        - historyText
        - galleryTitle
        - galleryHint
      properties:
        language: { type: string, enum: [hu, ro, en] }
        version:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Null only when the language-specific translation does not exist yet.
        name: { type: string, maxLength: 160 }
        shortDescription: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        roomDescription: { type: string, maxLength: 3000 }
        storyEyebrow: { type: string, maxLength: 240 }
        storyTitle: { type: string, maxLength: 240 }
        diningEyebrow: { type: string, maxLength: 240 }
        diningTitle: { type: string, maxLength: 240 }
        diningDescription: { type: string, maxLength: 1000 }
        amenitiesTitle: { type: string, maxLength: 240 }
        roomTypesTitle: { type: string, maxLength: 240 }
        pricingTitle: { type: string, maxLength: 240 }
        historyEyebrow: { type: string, maxLength: 240 }
        historyTitle: { type: string, maxLength: 240 }
        historyText: { type: string, maxLength: 5000 }
        galleryTitle: { type: string, maxLength: 240 }
        galleryHint: { type: string, maxLength: 500 }
    AdminGuesthouseTranslationUpdate:
      type: object
      additionalProperties: false
      required:
        - version
        - name
        - shortDescription
        - description
        - roomDescription
        - storyEyebrow
        - storyTitle
        - diningEyebrow
        - diningTitle
        - diningDescription
        - amenitiesTitle
        - roomTypesTitle
        - pricingTitle
        - historyEyebrow
        - historyTitle
        - historyText
        - galleryTitle
        - galleryHint
      properties:
        version:
          type: [integer, 'null']
          format: int64
          minimum: 0
        name: { type: string, minLength: 1, maxLength: 160 }
        shortDescription: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        roomDescription: { type: string, minLength: 1, maxLength: 3000 }
        storyEyebrow: { type: string, minLength: 1, maxLength: 240 }
        storyTitle: { type: string, minLength: 1, maxLength: 240 }
        diningEyebrow: { type: string, minLength: 1, maxLength: 240 }
        diningTitle: { type: string, minLength: 1, maxLength: 240 }
        diningDescription: { type: string, minLength: 1, maxLength: 1000 }
        amenitiesTitle: { type: string, minLength: 1, maxLength: 240 }
        roomTypesTitle: { type: string, minLength: 1, maxLength: 240 }
        pricingTitle: { type: string, minLength: 1, maxLength: 240 }
        historyEyebrow: { type: string, minLength: 1, maxLength: 240 }
        historyTitle: { type: string, minLength: 1, maxLength: 240 }
        historyText: { type: string, minLength: 1, maxLength: 5000 }
        galleryTitle: { type: string, minLength: 1, maxLength: 240 }
        galleryHint: { type: string, minLength: 1, maxLength: 500 }
    AdminGuesthouseContentError:
      type: object
      additionalProperties: false
      required: [code, fieldErrors]
      properties:
        code:
          type: string
          enum:
            - ADMIN_GUESTHOUSE_NOT_FOUND
            - UNSUPPORTED_CONTENT_LANGUAGE

  - id: bukovina
    slug: bukovina-panzio
    room_count: 12
    shared_content_refs: [contact, address, services, pricing, booking_request]
    content:
      name:
        hu: "Bukovina Panzió"
        ro: "Pensiunea Bukovina"
        en: "Bukovina Guesthouse"
      short_description:
        hu: "Tágas, családias szállás 12 szobával, párok, családok és nagyobb társaságok számára."
        ro: "O pensiune spațioasă și primitoare, cu 12 camere pentru cupluri, familii și grupuri mai numeroase."
        en: "A spacious, welcoming 12-room guesthouse for couples, families, and larger groups."
      detailed_description:
        hu: "A Bukovina Panzió 12 rendezett, kényelmes szobával kínál nyugodt szállást Csernakeresztúron. A két-, három- és négyágyas szobák párok, családok és nagyobb társaságok elhelyezésére is alkalmasak; mindegyikhez saját fürdőszoba, televízió, központi fűtés és légkondicionálás tartozik. Minden emeleten felszerelt közös konyha található. A közös szolgáltatások között házi jellegű erdélyi magyaros étkezés egy nagy étkezőben, zárt parkoló, internetkapcsolat, terasz, szabadtéri főzési lehetőség, valamint hidromasszázs- és aeromasszázs-funkciós wellnessdézsa, kültéri zuhanyzó és napozóágyak is szerepelnek. A vendégek pihenéssel tölthetik idejüket, vagy innen indulva felfedezhetik Dél-Erdély történelmi és természeti látnivalóit."
        ro: "Pensiunea Bukovina oferă cazare liniștită în Cristur, în 12 camere îngrijite și confortabile. Camerele duble, triple și cvadruple sunt potrivite pentru cupluri, familii și grupuri mai numeroase; fiecare cameră are baie proprie, televizor, încălzire centrală și aer condiționat. La fiecare etaj se află o bucătărie comună utilată. Serviciile comune includ preparate ardelenești și ungurești cu caracter tradițional servite într-o sală de mese mare, parcare închisă, internet, terasă, posibilități de gătit în aer liber, precum și un ciubăr wellness cu hidromasaj și aeromasaj, duș exterior și șezlonguri. Oaspeții se pot bucura de odihnă sau pot porni de aici pentru a descoperi atracțiile istorice și naturale ale Transilvaniei de Sud."
        en: "Bukovina Guesthouse offers peaceful accommodation in Cristur in 12 tidy, comfortable rooms. Its double, triple, and quadruple rooms suit couples, families, and larger groups; every room has a private bathroom, television, central heating, and air conditioning. Every floor has an equipped shared kitchen. Shared services include homemade Transylvanian-Hungarian meals served in one large dining room, enclosed parking, internet access, a terrace, outdoor cooking facilities, and a wellness tub with hydro- and air massage, an outdoor shower, and sun loungers. Guests can spend their time relaxing or use the guesthouse as a base for exploring the historic and natural sights of Southern Transylvania."
      verification:
        status: derived
        source_ids: [nisztor-home-hu, nisztor-about-hu, project-seed, owner-confirmation]

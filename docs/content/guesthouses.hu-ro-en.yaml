owner_confirmation_required:
  - id: shared_services
    applies_to: [nisztor, bukovina]
    question:
      hu: "A felsorolt közös szolgáltatások jelenleg mindkét épület vendégei számára elérhetők?"
      ro: "Sunt disponibile în prezent toate serviciile comune enumerate pentru oaspeții ambelor clădiri?"
      en: "Are all listed shared services currently available to guests of both buildings?"
    reason:
      hu: "A közös alkalmazhatóság tulajdonosi megerősítést kapott, de a szolgáltatások elérhetősége változhat."
      ro: "Aplicabilitatea comună a fost confirmată de proprietar, însă disponibilitatea serviciilor se poate schimba."
      en: "Shared applicability was confirmed by the owner, but service availability may change."
    blocking_publication: false
  - id: bicycle_and_animals
    applies_to: [nisztor, bukovina]
    question:
      hu: "Jelenleg is igénybe vehető a kerékpárkölcsönzés és a háziállatok megtekintése?"
      ro: "Mai sunt disponibile închirierea bicicletelor și vizitarea animalelor domestice?"
      en: "Are bicycle rental and opportunities to see domestic animals still available?"
    reason:
      hu: "Ezek csak a vendégház-hálózat oldalán szerepelnek."
      ro: "Aceste servicii apar numai pe pagina rețelei de pensiuni."
      en: "These services appear only on the guesthouse-network website."
    blocking_publication: false
  - id: nisztor_family_story
    applies_to: [nisztor]
    question:
      hu: "Mi a Nisztor család és a panzió alapításának hiteles, publikálható története?"
      ro: "Care este istoria verificată și publicabilă a familiei Nisztor și a înființării pensiunii?"
      en: "What is the verified, publishable history of the Nisztor family and the founding of the guesthouse?"
    reason:
      hu: "A jelenlegi források csak a helyi közösség történetét ismertetik."
      ro: "Sursele actuale prezintă numai istoria comunității locale."
      en: "The current sources describe only the history of the local community."
    blocking_publication: false
  - id: bukovina_foundation_story
    applies_to: [bukovina]
    question:
      hu: "Mi a Bukovina Panzió alapításának és családi hátterének hiteles, publikálható története?"
      ro: "Care este istoria verificată și publicabilă a înființării Pensiunii Bukovina și a familiei asociate?"
      en: "What is the verified, publishable founding and family story of Bukovina Guesthouse?"
    reason:
      hu: "A jelenlegi források nem tartalmaznak külön panziótörténetet."
      ro: "Sursele actuale nu conțin o istorie separată a pensiunii."
      en: "The current sources do not contain a separate history of the guesthouse."
    blocking_publication: false
  - id: preferred_cover_images
    applies_to: [nisztor, bukovina]
    question:
      hu: "Maradjon mindkét panziónál a galéria első képe fő képként?"
      ro: "Să rămână prima imagine din fiecare galerie drept imagine principală?"
      en: "Should the first image in each gallery remain the cover image?"
    reason:
      hu: "A jelenlegi projekt az első képet használja, de a marketingcélú választás tulajdonosi döntés."
      ro: "Proiectul actual folosește prima imagine, însă alegerea imaginii de prezentare este o decizie a proprietarului."
      en: "The current project uses the first image, but the marketing choice belongs to the owner."
    blocking_publication: false
  - id: privacy_policy_url
    applies_to: [nisztor, bukovina]
    question:
      hu: "Melyik adatkezelési tájékoztató URL-jét kell a foglalási kérelem mellett megjeleníteni?"
      ro: "Ce adresă URL a informării privind prelucrarea datelor trebuie afișată lângă cererea de rezervare?"
      en: "Which privacy-notice URL should be displayed with the booking inquiry?"
    reason:
      hu: "A forrásoldalon hozzájárulás szerepel, de hiteles cél-URL nem azonosítható."
      ro: "Pagina-sursă include consimțământul, dar nu a putut fi identificată o adresă URL verificată."
      en: "The source page includes consent, but a verified destination URL could not be identified."
    blocking_publication: true
  - id: booking_delivery
    applies_to: [nisztor, bukovina]
    question:
      hu: "Hová érkezzenek a foglalási kérelmek, és milyen válaszidőt ígérhetünk a vendégeknek?"
      ro: "Unde trebuie trimise cererile de rezervare și ce termen de răspuns poate fi promis oaspeților?"
      en: "Where should booking inquiries be delivered, and what response time may be promised to guests?"
    reason:
      hu: "A tartalom meghatározza a kérelem mezőit, de a feldolgozási folyamatot nem."
      ro: "Conținutul definește câmpurile cererii, dar nu și fluxul de procesare."
      en: "The content defines the inquiry fields but not the handling workflow."
    blocking_publication: true

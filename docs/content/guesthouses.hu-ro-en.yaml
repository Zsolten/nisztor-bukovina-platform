guesthouses:
  - id: nisztor
    slug: nisztor-panzio
    room_count: 5
    shared_content_refs: [contact, address, services, pricing, booking_request]
    content:
      name:
        hu: "Nisztor Panzió"
        ro: "Pensiunea Nisztor"
        en: "Nisztor Guesthouse"
      short_description:
        hu: "Csendes, családias szállás Csernakeresztúr központjától mindössze 200 méterre."
        ro: "Cazare liniștită și primitoare, la doar 200 de metri de centrul satului Cristur."
        en: "Peaceful, welcoming accommodation just 200 metres from the centre of Cristur."
      detailed_description:
        hu: "A Nisztor Panzió Csernakeresztúron, Déva és Vajdahunyad között félúton, a falu központjától mindössze 200 méterre várja vendégeit. A főúttól távol eső, nyugodt környezet ideális egy rövid megállóhoz és többnapos pihenéshez is. Az öt rendezett, kényelmes szobához saját fürdőszoba, televízió, központi fűtés és légkondicionálás tartozik. Minden emeleten felszerelt közös konyha, a kikapcsolódáshoz pedig hidromasszázs- és aeromasszázs-funkciós wellnessdézsa, kültéri zuhanyzó és napozóágyak állnak rendelkezésre. A házigazdák családias vendéglátással, házi jellegű erdélyi magyaros ételekkel, valamint igény szerint program- és csillagtúra-ajánlatokkal teszik teljessé az itt-tartózkodást."
        ro: "Pensiunea Nisztor își întâmpină oaspeții în satul Cristur, la jumătatea drumului dintre Deva și Hunedoara și la numai 200 de metri de centrul localității. Amplasarea liniștită, departe de traficul șoselei principale, este potrivită atât pentru un popas scurt, cât și pentru un sejur de mai multe zile. Cele cinci camere îngrijite și confortabile au baie proprie, televizor, încălzire centrală și aer condiționat. La fiecare etaj se află o bucătărie comună utilată, iar pentru relaxare sunt disponibile un ciubăr wellness cu hidromasaj și aeromasaj, duș exterior și șezlonguri. Ospitalitatea caldă, preparatele ardelenești și ungurești cu caracter tradițional, precum și recomandările de programe și excursii completează experiența șederii."
        en: "Nisztor Guesthouse welcomes visitors in Cristur, halfway between Deva and Hunedoara and only 200 metres from the village centre. Its peaceful setting away from main-road traffic suits both an overnight stop and a longer stay. Each of the five tidy, comfortable rooms has a private bathroom, television, central heating, and air conditioning. Every floor has an equipped shared kitchen, while a wellness tub with hydro- and air massage, an outdoor shower, and sun loungers provide space to unwind. Warm family hospitality, homemade Transylvanian-Hungarian food, and optional programme and day-trip suggestions round out the experience."
      verification:
        status: derived
        source_ids: [nisztor-home-hu, nisztor-home-ro, nisztor-about-hu, project-seed]
    history:
      community_heritage:
        title:
          hu: "Bukovinai székely örökség Csernakeresztúron"
          ro: "Moștenirea secuilor bucovineni din Cristur"
          en: "Bukovina Szekler heritage in Cristur"
        text:
          hu: "Csernakeresztúr lakosságának több mint fele bukovinai székely gyökerekkel rendelkezik. Őseik az 1764-es madéfalvi veszedelem után Bukovinába menekültek, ahol Istensegíts, Fogadjisten, Hadikfalva, Andrásfalva és Józseffalva közösségeiben telepedtek le. A magyar állam 1911-ben telepített családokat a mai Csernakeresztúrra. Az új közösség 1915–1916-ban templomot épített, 1920-ban pedig katolikus iskolát indított. A bukovinai székely hagyományokat és néptáncokat a helyiek nemzedékről nemzedékre továbbadják."
          ro: "Mai mult de jumătate dintre locuitorii satului Cristur au rădăcini secuiești bucovinene. Strămoșii lor s-au refugiat în Bucovina după evenimentele de la Siculeni din 1764 și s-au așezat în comunitățile Istensegíts, Fogadjisten, Hadikfalva, Andrásfalva și Józseffalva. În 1911, statul maghiar a strămutat familii în actualul Cristur. Noua comunitate a ridicat o biserică în anii 1915–1916 și a deschis o școală catolică în 1920. Tradițiile și dansurile secuilor bucovineni sunt transmise și astăzi din generație în generație."
          en: "More than half of Cristur's residents have Bukovina Szekler roots. Their ancestors fled to Bukovina after the 1764 events at Siculeni and settled in the communities of Istensegíts, Fogadjisten, Hadikfalva, Andrásfalva, and Józseffalva. In 1911, the Hungarian state resettled families in present-day Cristur. The new community built a church in 1915–1916 and opened a Catholic school in 1920. Bukovina Szekler traditions and folk dances continue to be passed down from one generation to the next."
        verification:
          status: derived
          source_ids: [cserna-about-hu, cserna-about-en]
      family_story:
        editorial_note:
          hu: "A jelenlegi források nem közölnek ellenőrizhető személyes Nisztor családtörténetet vagy panzióalapítási történetet. Ezt a részt csak a tulajdonos által jóváhagyott adatokkal szabad publikálni."
          ro: "Sursele actuale nu oferă o istorie personală verificabilă a familiei Nisztor sau a înființării pensiunii. Această secțiune trebuie publicată numai după aprobarea informațiilor de către proprietar."
          en: "The current sources do not provide a verifiable personal history of the Nisztor family or the founding of the guesthouse. This section should be published only after the owner has approved the information."
        verification:
          status: needs_owner_confirmation
          source_ids: []

  booking_request:
    action: inquiry
    explanation:
      hu: "Az űrlap foglalási kérelmet indít. A beküldés önmagában nem igazolja a szabad kapacitást, és nem jelent visszaigazolt foglalást."
      ro: "Formularul inițiază o cerere de rezervare. Trimiterea lui nu confirmă disponibilitatea și nu reprezintă o rezervare confirmată."
      en: "The form starts a booking inquiry. Submission does not confirm availability and does not constitute a confirmed reservation."
    fields:
      - id: guest_name
        type: text
        required: true
        label:
          hu: "Név"
          ro: "Nume"
          en: "Name"
      - id: email
        type: email
        required: true
        label:
          hu: "E-mail-cím"
          ro: "Adresă de e-mail"
          en: "Email address"
      - id: phone
        type: tel
        required: false
        label:
          hu: "Telefonszám"
          ro: "Număr de telefon"
          en: "Phone number"
      - id: guesthouse
        type: guesthouse_reference
        required: true
        label:
          hu: "Választott panzió"
          ro: "Pensiunea aleasă"
          en: "Preferred guesthouse"
      - id: arrival_date
        type: date
        required: true
        label:
          hu: "Érkezés"
          ro: "Sosire"
          en: "Arrival"
      - id: departure_date
        type: date
        required: true
        label:
          hu: "Távozás"
          ro: "Plecare"
          en: "Departure"
      - id: adult_count
        type: integer
        required: true
        minimum: 1
        label:
          hu: "Felnőttek száma"
          ro: "Număr de adulți"
          en: "Number of adults"
      - id: child_count
        type: integer
        required: false
        minimum: 0
        label:
          hu: "Gyermekek száma"
          ro: "Număr de copii"
          en: "Number of children"
      - id: requested_rooms
        type: room_request
        required: false
        label:
          hu: "Igényelt szobák"
          ro: "Camere solicitate"
          en: "Requested rooms"
      - id: meal_plan
        type: enum
        required: false
        label:
          hu: "Ellátási igény"
          ro: "Regim de masă dorit"
          en: "Preferred meal plan"
